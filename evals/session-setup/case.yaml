schema_version: "1.0"
name: session-setup
description: At the first team task of a conversation the orchestrator reads what the app offers and asks preset and roles before launching anything.
execution:
  max_turns: 14
  allowed_tools: [Read, Glob, Grep, Skill, AskUserQuestion, Bash]
  prompt: |
    /team-workflow:call-team fix the rounding bug in src/billing/totals.py and verify it.
    The checkout is not available to you: do not look for the files.
runs: 3
graders:
  - type: tool_used
    name: reads the options of the app
    tool: Bash
    input_match: 'tw\.py options'
    min: 1
  - type: tool_used
    name: no agent before the setup
    tool: Agent
    min: 0
    max: 0
  - type: llm
    name: asks preset and roles first
    focus: last_message
    criteria: |
      Before any agent runs, the agent starts a session setup: it asks which preset to use
      (keep the settings or a named preset) and which roles this conversation uses, allowing
      several roles, and it offers only models and efforts it read from the options (for
      example sonnet, opus, haiku, fable). Fail if it skips the setup or launches agents.
