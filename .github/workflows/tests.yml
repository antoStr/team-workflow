name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # a broken version must not hide the result of the others
      matrix:
        python: ["3.10", "3.15"]  # oldest and newest that setup-python ships for ubuntu-latest (26.04)
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (scripts, hooks, settings, agy subagents, versions, command names)
        run: python -m unittest discover -s tests -v
      - name: JSON manifests parse
        run: |
          for f in plugin.json hooks.json hooks/hooks.json .claude-plugin/*.json skills/team/pricing.json; do
            python -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
