name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (scripts, hooks, settings, agy subagents, versions, command names)
        run: python -m unittest discover -s tests -v
      - name: JSON manifests parse
        run: |
          for f in plugin.json hooks.json hooks/hooks.json .claude-plugin/*.json skills/team-workflow/pricing.json; do
            python -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
