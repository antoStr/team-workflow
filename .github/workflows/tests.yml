name: tests

on:
  push:
  pull_request:

permissions:
  contents: read  # the tests only read the code

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false  # a broken version must not hide the result of the others
      matrix:
        python: ["3.10", "3.15"]  # oldest and newest that setup-python ships for ubuntu-latest (26.04)
    steps:
      # actions pinned to a commit: a moved tag cannot change what runs; Dependabot bumps them
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (scripts, hooks, settings, agy subagents, versions, command names)
        run: python -m unittest discover -s tests -v
      - name: JSON manifests parse
        run: |
          for f in plugin.json hooks.json hooks/hooks.json .claude-plugin/*.json skills/team/pricing.json; do
            python -m json.tool "$f" > /dev/null || { echo "invalid JSON: $f"; exit 1; }
          done
